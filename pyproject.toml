[project]
name = "cluster-triage-agent"
version = "0.1.0"
description = "AI agent that diagnoses a broken Kubernetes namespace through read-only MCP tools and proposes a YAML fix."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "openai>=3.0",
    "mcp>=2.0,<3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Self-hosted tracing with Arize Phoenix. Install with: uv sync --extra tracing
tracing = [
    "arize-phoenix-otel",
    "openinference-instrumentation-anthropic",
    "openinference-instrumentation-openai",
]

[project.scripts]
triage = "triage.cli:main"
triage-mcp = "triage.mcp_server.server:main"
triage-eval = "triage.evals.runner:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["phoenix.*", "openinference.*", "opentelemetry.*"]
ignore_missing_imports = true
