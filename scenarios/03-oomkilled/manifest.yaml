# `tail /dev/zero` keeps buffering a "line" that never ends, so memory grows
# until it passes the 16Mi limit and the kernel kills the container (OOMKilled).
apiVersion: v1
kind: Namespace
metadata:
  name: triage-03-oomkilled
  labels:
    triage.scenario: 03-oomkilled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: triage-03-oomkilled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          command: ["sh", "-c"]
          args:
            - |
              echo "loading cache into memory"
              tail /dev/zero
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 16Mi}
