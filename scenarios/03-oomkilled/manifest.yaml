# The worker loads a 40 MiB "cache" and keeps it in memory, but its limit is
# 16Mi, so the kernel kills it on every start (OOMKilled). Raising the limit to
# 64Mi fixes it (DECISIONS.md 031).
# How it holds the memory: dd reads one 40 MiB block (bs=41943040) into a buffer,
# then blocks writing it to `sleep`, which never reads; the buffer stays resident.
apiVersion: v1
kind: Namespace
metadata:
  name: triage-03-oomkilled
  labels:
    triage.scenario: 03-oomkilled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: triage-03-oomkilled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          command: ["sh", "-c"]
          args:
            - |
              echo "loading cache into memory"
              dd if=/dev/zero bs=41943040 count=1 | sleep 2147483647
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 16Mi}
