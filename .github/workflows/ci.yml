name: CI

# Every push to main and every PR. Offline: no model API, no cluster, no secrets.
# tests/conftest.py makes any outbound network call fail (DECISIONS.md 045).
# The secrets job scans the whole git history with gitleaks (DECISIONS.md 048).
# Actions are pinned to commits; Dependabot proposes updates (.github/dependabot.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Eval gate (offline, golden fake model)
        run: uv run triage-eval --provider fake --gate

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a secret removed in a later commit is still published
          persist-credentials: false
      # The release binary, checked against its published SHA-256, rather than an action:
      # same pinning as everything else here, and no licence key question.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      # Known false positives are listed by fingerprint in .gitleaksignore.
      - name: Scan every commit for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
